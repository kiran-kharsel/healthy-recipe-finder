<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/about.css">
    <script src="./js/loadComponent.js" defer></script>
</head>

<body>
    <section id="header" class="header">
        <!-- place holder for header component -->
    </section>

    <main class="our-story">
        <div class="container flex">
            <h1 class="heading">our story</h1>
            <p>we believe that healthy eating should not be complecated, time-consuming, or boring. our mission is to
                make nutritious cookingaccessible to everyone.</p>
        </div>
    </main>

    <section class="rating-section">
        <div class="container flex">
            <div class="rating">
                <div class="rating-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <h4>10K+</h4>
                <p>Happy Cooks</p>
            </div>

            <div class="rating">
                <div class="rating-icon">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h4>500+</h4>
                <p>Happy Cooks</p>
            </div>

            <div class="rating">
                <div class="rating-icon">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <h4>30min</h4>
                <p>avarage cook time</p>
            </div>

            <div class="rating">
                <div class="rating-icon">
                    <i class="fa-solid fa-medal"></i>
                </div>
                <h4>5<i class="fa-solid fa-star"></i></h4>
                <p>avaarage rating</p>
            </div>
        </div>
    </section>



    <section id="footer" class="footer">
        <!-- place holder for footer component -->
    </section>
</body>

</html>
